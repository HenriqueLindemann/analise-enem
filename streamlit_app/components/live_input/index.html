<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Respostas da prova</title>
    <script src="./streamlit-component-lib.js"></script>
    <!-- Wait for the input DOM before announcing readiness to Streamlit. -->
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body id="root">
    <div>
      <label id="label" for="input_box">Respostas</label>
      <div class="input">
        <input type="text" name="text_input" id="input_box" autocomplete="off"
               autocorrect="off" autocapitalize="characters" spellcheck="false" />
      </div>
    </div>
  </body>
</html>
