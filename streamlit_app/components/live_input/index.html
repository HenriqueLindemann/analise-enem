<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Respostas da prova</title>
    <script src="./streamlit-component-lib.js"></script>
    <!-- Wait for the input DOM before announcing readiness to Streamlit. -->
    <script src="./main.js" defer></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body id="root">
    <label id="label" class="sr-only" for="input_box">Respostas</label>
    <div class="caixa" id="caixa">
      <div class="folha" id="folha">
        <div class="camada" id="camada" aria-hidden="true"></div>
        <textarea id="input_box" rows="1" autocomplete="off" autocorrect="off"
                  autocapitalize="characters" spellcheck="false" enterkeyhint="done"
                  aria-describedby="status"></textarea>
      </div>
    </div>
    <div class="status" id="status">
      <span id="contador"></span>
      <span id="posicao" aria-live="polite"></span>
    </div>
  </body>
</html>
