<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-labelledby="titulo descricao"><title id="titulo">As notas conectam identidade e microdados</title><desc id="descricao">Notas conectam identidade e microdados. Estimativa de 14,7 milhões de pessoas distintas com registros vinculados no SISU–ENEM (2010–2023).</desc><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="32" font-size="15" fill="#a7b3bd" font-weight="400" >Divulgações públicas</text><text x="852" y="32" font-size="15" fill="#a7b3bd" font-weight="400"  text-anchor="end">Microdados do ENEM</text><rect x="28" y="50" width="332" height="70" rx="8" fill="#63cba5" fill-opacity=".025" stroke="#303b46"/><rect x="520" y="50" width="332" height="70" rx="8" fill="#63cba5" fill-opacity=".025" stroke="#303b46"/><rect x="246" y="51" width="113" height="68" rx="7" fill="#63cba5" fill-opacity=".10"/><rect x="521" y="51" width="113" height="68" rx="7" fill="#63cba5" fill-opacity=".10"/><text x="137" y="93" font-size="18" fill="#e6edf3" font-weight="600"  text-anchor="middle">Identidade</text><text x="302" y="93" font-size="21" fill="#63cba5" font-weight="600" text-anchor="middle">Notas</text><text x="578" y="93" font-size="21" fill="#63cba5" font-weight="600" text-anchor="middle">Notas</text><text x="743" y="93" font-size="18" fill="#e6edf3" font-weight="600"  text-anchor="middle">Dados associados</text><text x="440" y="75" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#a7b3bd" text-anchor="middle">score linkage</text><path d="M360 85H520" stroke="#63cba5" stroke-width="2" stroke-opacity=".55"/><circle cx="360" cy="85" r="3" fill="#63cba5"/><circle cx="520" cy="85" r="3" fill="#63cba5"/><path d="M28 153H852" stroke="#303b46"/><text x="28" y="198" font-size="30" fill="#63cba5" font-weight="600" >≈ 14,7 milhões</text><text x="258" y="184" font-size="14" fill="#e6edf3" font-weight="600" >de pessoas distintas estimadas com registros vinculados</text><text x="258" y="208" font-size="12" fill="#a7b3bd" font-weight="400" >SISU–ENEM · 2010–2023</text></g></svg>