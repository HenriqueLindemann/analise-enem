<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">As notas conectam identidade e microdados</title>
  <desc id="descricao">Notas conectam identidade e microdados. Estimativa de 14,7 milhões de pessoas distintas com registros vinculados no SISU–ENEM (2010–2023).</desc>
  <style>.texto { fill: #253746; }
.secundario { fill: #596873; }
.resposta { fill: #405562; }
.acerto { fill: #20805f; }
.erro { fill: #bb503e; }
.grade { stroke: #dce3e7; }
.seta { stroke: #8a979f; }
.ligacao { stroke: #20805f; }</style>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="38.1" font-size="14" class="secundario">Divulgações públicas</text>
    <text x="852" y="38.1" font-size="14" class="secundario" text-anchor="end">Microdados do ENEM</text>
    <rect x="28" y="52.1" width="332" height="72" rx="8" fill-opacity=".025" class="acerto grade" />
    <rect x="246" y="53.1" width="113" height="70" rx="7" fill-opacity=".10" class="acerto" />
    <text x="302.5" y="95.2" font-size="20" class="acerto" text-anchor="middle" font-weight="bold">Notas</text>
    <text x="137.5" y="95.2" font-size="20" class="texto" text-anchor="middle" font-weight="bold">Identidade</text>
    <rect x="520" y="52.1" width="332" height="72" rx="8" fill-opacity=".025" class="acerto grade" />
    <rect x="521" y="53.1" width="113" height="70" rx="7" fill-opacity=".10" class="acerto" />
    <text x="577.5" y="95.2" font-size="20" class="acerto" text-anchor="middle" font-weight="bold">Notas</text>
    <text x="742.5" y="95.2" font-size="20" class="texto" text-anchor="middle" font-weight="bold">Dados associados</text>
    <path d="M360 88.1H520" stroke-width="2" stroke-opacity=".55" fill="none" class="ligacao" />
    <circle cx="360" cy="88.1" r="3" class="acerto" />
    <circle cx="520" cy="88.1" r="3" class="acerto" />
    <text x="440.0" y="76.1" font-size="14" class="secundario" font-style="italic" text-anchor="middle">score linkage</text>
    <path d="M28 152.1H852" class="grade" />
    <text x="28" y="203.0" font-size="32" class="acerto" font-weight="bold">≈ 14,7 milhões</text>
    <text x="270.6" y="186.3" font-size="16" class="texto" font-weight="bold">de pessoas distintas estimadas com registros vinculados</text>
    <text x="270.6" y="208.3" font-size="14" class="secundario">SISU–ENEM · 2010–2023</text>
  </g>
