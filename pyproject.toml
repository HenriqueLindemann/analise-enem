# =============================================================================
# Calculadora Nota TRI ENEM
# https://notatri.com
#
# Este arquivo e ADITIVO: centraliza o empacotamento (src-layout) e a
# configuracao do pytest para o fluxo de desenvolvimento.
#
# O deploy web (Streamlit Community Cloud) NAO usa este arquivo: ele instala
# via `streamlit_app/requirements.txt` e roda o app pelo sys.path. Por isso os
# `requirements.txt` sao a fonte de verdade das dependencias, e este arquivo os
# le (ver [tool.setuptools.dynamic]) em vez de repetir as listas.
# =============================================================================

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tri-enem"
version = "4.0.0"  # espelha src/tri_enem/__init__.py:__version__
description = "Calculadora de nota TRI do ENEM (2009-2025) por Teoria de Resposta ao Item"
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Henrique Lindemann" }]

# As dependencias sao lidas dos requirements.txt, que continuam sendo a fonte
# de verdade (o deploy no Streamlit Cloud instala por eles, sem passar por este
# arquivo). Declara-las aqui tambem exigiria manter duas listas em sincronia.
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.web = { file = ["streamlit_app/requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[project.urls]
Homepage = "https://notatri.com/"
Repository = "https://github.com/HenriqueLindemann/analise-enem"

# --- Empacotamento (src-layout) --------------------------------------------
# Permite `pip install -e .` para desenvolvedores, sem afetar o fluxo
# sem-instalacao usado pelos entry points (que mantem o sys.path shim).
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Dados essenciais empacotados junto com o modulo
tri_enem = ["*.yaml", "*.json", "data/itens/manifest.json", "data/itens/*/*.csv"]

# --- Configuracao do pytest -------------------------------------------------
# Coleta apenas os testes reais (test_*.py); os scripts de validacao em
# tests/ (gerar_*, validar_*, extrair_*, executar_*, run_full_validation)
# nao sao coletados como testes.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
